<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New GURUKULAM - Smart Learning Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0369a1', 700: '#075985', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .card-3d { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-3d:hover { transform: translateY(-5px) rotateX(2deg) rotateY(-2deg); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
    .btn-3d { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .btn-3d:active { transform: translateY(2px); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Top Navigation Header & Admin Bar -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div id="admin-bar" class="hidden bg-amber-500 text-slate-950 font-semibold px-4 py-1.5 text-xs sm:text-sm flex justify-between items-center shadow-inner">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-user-shield text-base"></i>
        <span><strong>Admin Mode Active:</strong> You can edit every text, title, description, and image across the entire website.</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openModal('editGlobalConfig')" class="bg-slate-900 text-white px-2.5 py-0.5 rounded text-xs transition hover:bg-slate-800"><i class="fa-solid fa-pen-to-square"></i> Edit Global Texts & Logo</button>
        <button onclick="resetToDefaults()" class="bg-amber-700 hover:bg-amber-800 text-white px-2 py-0.5 rounded text-xs transition">Reset All</button>
        <button onclick="logoutAdmin()" class="bg-slate-900 text-white px-2.5 py-0.5 rounded-md hover:bg-slate-800 transition text-xs flex items-center gap-1">
          <i class="fa-solid fa-right-from-bracket"></i> Exit Admin
        </button>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <div onclick="navigateTo('classes')" class="flex items-center gap-2 cursor-pointer group">
            <div id="header-logo-container" class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:scale-105 transition overflow-hidden">
              <i id="header-logo-icon" class="fa-solid fa-graduation-cap"></i>
              <img id="header-logo-img" src="" class="w-full h-full object-cover hidden" alt="Logo">
            </div>
            <span id="app-brand-title" class="text-xl font-bold bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">New GURUKULAM</span>
          </div>

          <nav id="breadcrumb" class="hidden md:flex items-center gap-2 text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium ml-4">
            <!-- Dynamic Breadcrumb Navigation -->
          </nav>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Toggle Theme">
            <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
          </button>

          <div id="admin-auth-btn">
            <button onclick="openAdminModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-brand-500 hover:text-white transition font-medium text-xs sm:text-sm flex items-center gap-2 btn-3d">
              <i class="fa-solid fa-lock"></i>
              <span id="admin-btn-text">Admin Login</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Rendered dynamically -->
  </main>

  <!-- Dynamic Modal Form -->
  <div id="action-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 relative max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
        <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">Modal Title</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <form id="modal-form" onsubmit="handleModalSubmit(event)" class="space-y-4 overflow-y-auto pr-1 flex-grow">
        <div id="modal-fields" class="space-y-4">
          <!-- Inputs dynamically populated -->
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 mt-auto">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium text-xs">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs shadow-md btn-3d">Save / Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin Login Security Modal -->
  <div id="admin-login-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 relative">
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-900 dark:text-white">Admin Authentication</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter <strong>password</strong> (7655) to unlock universal text editing</p>
      </div>
      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <input type="password" id="admin-password-input" placeholder="Passcode" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-center font-mono text-lg tracking-widest outline-none focus:ring-2 focus:ring-amber-500" />
          <p id="admin-login-error" class="text-red-500 text-xs mt-1.5 hidden text-center font-medium">Invalid passcode. Please try again.</p>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm shadow-md btn-3d">
          Verify & Unlock
        </button>
      </form>
    </div>
  </div>

  <!-- File Lightbox Overlay -->
  <div id="file-lightbox" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
    <div class="relative max-w-5xl w-full max-h-[90vh] bg-slate-900 rounded-2xl p-4 flex flex-col items-center">
      <button onclick="closeLightbox()" class="absolute top-3 right-4 text-white hover:text-slate-300 text-xl z-10"><i class="fa-solid fa-xmark"></i></button>
      <div id="lightbox-container" class="w-full h-full flex items-center justify-center overflow-hidden rounded-xl">
        <!-- Preview Content -->
      </div>
    </div>
  </div>

  <script>
    // --- RESTRICTION MAPPING ---
    const FILE_RESTRICTIONS = {
      audio: { accept: ".mp3,.wav,.mp4", label: "Audio (.MP3, .WAV, .MP4)" },
      video: { accept: ".mp4,.mov", label: "Video (.MP4, .MOV)" },
      notes: { accept: ".pdf", label: "Notes / Reports (.PDF)" },
      flashcards: { accept: ".csv", label: "Flashcards (.CSV - Front, Back)" },
      slides: { accept: ".pdf,.ppt,.pptx", label: "Slides (.PDF, .PPT, .PPTX)" },
      quiz: { accept: ".csv", label: "Quiz (.CSV - Question, Opt1, Opt2, Opt3, Opt4, CorrectIdx)" },
      infographic: { accept: ".jpg,.jpeg,.png,.pdf", label: "Infographic (.JPG, .PNG, .PDF)" },
      datatable: { accept: ".csv", label: "Data Table (.CSV)" }
    };

    // --- INITIAL SEED DATA WITH UNIVERSAL CUSTOMIZABLE STRINGS ---
    const INITIAL_DATA = {
      config: {
        brandName: "New GURUKULAM",
        logoUrl: "",
        uiTexts: {
          classesTitle: "Academic Classes",
          classesSubtitle: "Select a class level to proceed to language medium selection.",
          selectMediumBtn: "Select Medium",
          backToClassesBtn: "Back to Classes",
          selectSubjectBtn: "View Subjects",
          backToMediumsBtn: "Back to Mediums",
          viewChaptersBtn: "View Chapters",
          backToSubjectsBtn: "Back to Subjects",
          openChapterHubBtn: "Open Chapter Hub",
          quizCompletedTitle: "Quiz Completed",
          retryQuizBtn: "Retry Quiz",
          submitQuizBtn: "Submit Assessment",
          searchPlaceholder: "Search rows...",
          aiChatTitle: "Chapter Context AI Tutor",
          aiChatSubtitle: "Context Index: Reports, Flashcards, Quiz & Data Tables",
          aiChatPlaceholder: "Ask a question about this chapter's materials..."
        }
      },
      classes: [
        {
          id: "cls-10",
          name: "Class 10",
          description: "Secondary Education Level Curriculum",
          imageUrl: "",
          mediums: [
            {
              id: "med-en",
              name: "English Medium",
              code: "ENG",
              icon: "fa-language",
              imageUrl: "",
              subjects: [
                {
                  id: "sbj-phy",
                  name: "Physics",
                  code: "PHY10",
                  description: "General Physics Concepts & Mechanics",
                  icon: "fa-bolt",
                  imageUrl: "",
                  chapters: [
                    {
                      id: "ch-optics",
                      name: "Optics & Light Reflection",
                      description: "Laws of reflection, spherical mirrors, refraction, Snell's law, and optical instruments.",
                      resources: {
                        audio: [
                          { id: "aud-1", title: "Optics Core Lecture", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", type: "audio/mp3", content: "Introduction to Reflection & Spherical Mirror Laws." }
                        ],
                        video: [
                          { id: "vid-1", title: "Spherical Mirrors & Ray Diagrams", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", type: "video/mp4", content: "Ray tracing tutorial for concave and convex mirrors." }
                        ],
                        notes: [
                          { id: "not-1", title: "Comprehensive Optics Notes", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", content: "### Optics Standard Formulas\n1. Mirror Formula: 1/f = 1/v + 1/u\n2. Magnification: m = -v/u\n3. Snell's Law: n1 * sin(i) = n2 * sin(r)" }
                        ],
                        flashcards: [
                          { id: "fc-1", q: "What is the unit of power of a lens?", a: "Diopter (D)" },
                          { id: "fc-2", q: "What is the mirror formula?", a: "1/f = 1/v + 1/u" }
                        ],
                        slides: [
                          { id: "sld-1", title: "Optics Slide Deck Part 1", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", type: "pdf", content: "Presentation deck covering mirror ray diagrams." }
                        ],
                        mindmap: {
                          name: "Optics & Light",
                          children: [
                            { name: "Reflection", color: "#0284c7", children: [{ name: "Concave Mirrors" }, { name: "Convex Mirrors" }] },
                            { name: "Refraction", color: "#10b981", children: [{ name: "Snell's Law" }, { name: "Lenses & Power" }] }
                          ]
                        },
                        quiz: [
                          { id: "qz-1", question: "What is the SI unit of power of a lens?", options: ["Diopter", "Meter", "Watt", "Joule"], answer: 0 }
                        ],
                        infographic: [
                          { id: "inf-1", title: "Ray Diagram Cheat Sheet", url: "https://placehold.co/1200x800/0284c7/ffffff?text=Optics", type: "image/png" }
                        ],
                        datatable: [
                          {
                            id: "dt-1",
                            columns: ["Medium", "Refractive Index (n)", "Speed of Light (km/s)"],
                            rows: [
                              ["Vacuum", "1.00", "300,000"],
                              ["Air", "1.0003", "299,700"]
                            ]
                          }
                        ]
                      }
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    };

    let appState = {
      isAdmin: false,
      theme: 'dark',
      currentView: 'classes',
      selectedClassId: null,
      selectedMediumId: null,
      selectedSubjectId: null,
      selectedChapterId: null,
      selectedTab: 'video',
      data: INITIAL_DATA
    };

    // --- LOCAL STORAGE PERSISTENCE ---
    function loadState() {
      const saved = localStorage.getItem('newgurukulam_v4_data');
      if (saved) {
        try { appState.data = JSON.parse(saved); } catch(e) { console.error(e); }
      }
      if (!appState.data.config) appState.data.config = { brandName: "New GURUKULAM", logoUrl: "", uiTexts: INITIAL_DATA.config.uiTexts };
      if (!appState.data.config.uiTexts) appState.data.config.uiTexts = INITIAL_DATA.config.uiTexts;
      if (localStorage.getItem('newgurukulam_admin') === 'true') appState.isAdmin = true;
      appState.theme = localStorage.getItem('newgurukulam_theme') || 'dark';
      applyTheme();
      updateGlobalBranding();
    }

    function saveData() {
      localStorage.setItem('newgurukulam_v4_data', JSON.stringify(appState.data));
    }

    function resetToDefaults() {
      if (confirm("Reset all classes, subjects, branding, and all customized texts to defaults?")) {
        appState.data = INITIAL_DATA;
        saveData();
        updateGlobalBranding();
        renderBreadcrumb();
        renderView();
      }
    }

    function updateGlobalBranding() {
      const brandSpan = document.getElementById('app-brand-title');
      if (brandSpan) brandSpan.textContent = appState.data.config?.brandName || "New GURUKULAM";

      const logoImg = document.getElementById('header-logo-img');
      const logoIcon = document.getElementById('header-logo-icon');
      const logoUrl = appState.data.config?.logoUrl;
      if (logoUrl) {
        logoImg.src = logoUrl;
        logoImg.classList.remove('hidden');
        logoIcon.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        logoIcon.classList.remove('hidden');
      }
    }

    // --- THEME MANAGEMENT ---
    function toggleTheme() {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('newgurukulam_theme', appState.theme);
      applyTheme();
    }

    function applyTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (appState.theme === 'dark') {
        html.classList.add('dark');
        icon.className = "fa-solid fa-sun text-yellow-400";
      } else {
        html.classList.remove('dark');
        icon.className = "fa-solid fa-moon text-slate-700";
      }
    }

    // --- AUTH MANAGEMENT ---
    function openAdminModal() {
      if (appState.isAdmin) logoutAdmin();
      else document.getElementById('admin-login-modal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('admin-login-modal').classList.add('hidden');
      document.getElementById('admin-login-error').classList.add('hidden');
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const val = document.getElementById('admin-password-input').value;
      if (val === '7655') {
        appState.isAdmin = true;
        localStorage.setItem('newgurukulam_admin', 'true');
        closeAdminModal();
        updateAdminUI();
        renderView();
      } else {
        document.getElementById('admin-login-error').classList.remove('hidden');
      }
    }

    function logoutAdmin() {
      appState.isAdmin = false;
      localStorage.setItem('newgurukulam_admin', 'false');
      updateAdminUI();
      renderView();
    }

    function updateAdminUI() {
      const bar = document.getElementById('admin-bar');
      const text = document.getElementById('admin-btn-text');
      if (appState.isAdmin) {
        bar.classList.remove('hidden');
        text.textContent = "Exit Admin";
      } else {
        bar.classList.add('hidden');
        text.textContent = "Admin Login";
      }
    }

    // --- NAVIGATION ROUTER & BREADCRUMBS ---
    function navigateTo(view, classId = null, mediumId = null, subjectId = null, chapterId = null) {
      appState.currentView = view;
      if (classId !== null) appState.selectedClassId = classId;
      if (mediumId !== null) appState.selectedMediumId = mediumId;
      if (subjectId !== null) appState.selectedSubjectId = subjectId;
      if (chapterId !== null) appState.selectedChapterId = chapterId;
      renderBreadcrumb();
      renderView();
    }

    function renderBreadcrumb() {
      const container = document.getElementById('breadcrumb');
      let html = `<span class="cursor-pointer hover:text-brand-500" onclick="navigateTo('classes')">Classes</span>`;

      const curClass = appState.data.classes.find(c => c.id === appState.selectedClassId);
      if (curClass && ['mediums', 'subjects', 'chapters', 'chapter-detail'].includes(appState.currentView)) {
        html += ` <i class="fa-solid fa-chevron-right text-[10px]"></i> <span class="cursor-pointer hover:text-brand-500" onclick="navigateTo('mediums', '${curClass.id}')">${curClass.name}</span>`;
      }

      const curMedium = curClass?.mediums?.find(m => m.id === appState.selectedMediumId);
      if (curMedium && ['subjects', 'chapters', 'chapter-detail'].includes(appState.currentView)) {
        html += ` <i class="fa-solid fa-chevron-right text-[10px]"></i> <span class="cursor-pointer hover:text-brand-500" onclick="navigateTo('subjects', '${curClass.id}', '${curMedium.id}')">${curMedium.name}</span>`;
      }

      const curSubject = curMedium?.subjects?.find(s => s.id === appState.selectedSubjectId);
      if (curSubject && ['chapters', 'chapter-detail'].includes(appState.currentView)) {
        html += ` <i class="fa-solid fa-chevron-right text-[10px]"></i> <span class="cursor-pointer hover:text-brand-500" onclick="navigateTo('chapters', '${curClass.id}', '${curMedium.id}', '${curSubject.id}')">${curSubject.name}</span>`;
      }

      const curChapter = curSubject?.chapters?.find(ch => ch.id === appState.selectedChapterId);
      if (curChapter && appState.currentView === 'chapter-detail') {
        html += ` <i class="fa-solid fa-chevron-right text-[10px]"></i> <span class="text-slate-900 dark:text-white font-semibold">${curChapter.name}</span>`;
      }

      container.innerHTML = html;
    }

    function renderView() {
      const main = document.getElementById('app-content');
      switch (appState.currentView) {
        case 'classes': renderClassesView(main); break;
        case 'mediums': renderMediumsView(main); break;
        case 'subjects': renderSubjectsView(main); break;
        case 'chapters': renderChaptersView(main); break;
        case 'chapter-detail': renderChapterDetailView(main); break;
      }
    }

    // 1. CLASS VIEW
    function renderClassesView(container) {
      const ui = appState.data.config.uiTexts;
      let html = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">${ui.classesTitle}</h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-0.5">${ui.classesSubtitle}</p>
          </div>
          ${appState.isAdmin ? `
            <button onclick="openModal('addClass')" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold text-xs shadow-md transition flex items-center gap-2 btn-3d">
              <i class="fa-solid fa-plus font-bold"></i> Add Class
            </button>
          ` : ''}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      `;

      appState.data.classes.forEach(cls => {
        html += `
          <div class="bg-white dark:bg-slate-800/90 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700/60 shadow-sm hover:shadow-xl transition flex flex-col justify-between group card-3d">
            ${cls.imageUrl ? `
              <div class="w-full h-40 bg-slate-900 overflow-hidden relative">
                <img src="${cls.imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${cls.name}">
              </div>
            ` : ''}
            <div class="p-6 flex-grow flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start mb-4">
                  ${!cls.imageUrl ? `
                    <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-400 flex items-center justify-center text-2xl group-hover:scale-105 transition">
                      <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                  ` : '<div></div>'}
                  ${appState.isAdmin ? `
                    <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-700 text-xs">
                      <button onclick="openModal('editClass', '${cls.id}')" class="p-1.5 text-slate-500 hover:text-brand-500" title="Edit Class Text & Image"><i class="fa-solid fa-pen"></i></button>
                      <button onclick="deleteClass('${cls.id}')" class="p-1.5 text-slate-500 hover:text-red-500" title="Delete Class"><i class="fa-solid fa-trash"></i></button>
                    </div>
                  ` : ''}
                </div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-1">${cls.name}</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">${cls.description || 'Instructional Modules & Resources'}</p>
              </div>
              <div class="pt-4 mt-6 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-400">${cls.mediums?.length || 0} Mediums</span>

                        <button onclick="openLightboxFile('${res.url}', 'pdf')" class="px-3 py-1.5 rounded-xl bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700"><i class="fa-solid fa-expand"></i> Fullscreen</button>
                      ` : ''}
                      ${appState.isAdmin ? `
                        <button onclick="openModal('editResourceItem', {tab: 'notes', id: '${res.id}'})" class="px-2 py-1.5 text-slate-500 hover:text-brand-500 text-xs"><i class="fa-solid fa-pen"></i></button>

                        <span class="text-xs font-bold text-slate-900 dark:text-white truncate">${i + 1}. ${info.title || 'Infographic'}</span>

                          <div class="flex items-center gap-1">
                            <button onclick="openModal('editResourceItem', {tab: 'infographic', id: '${info.id}'})" class="text-xs text-slate-500 hover:text-brand-500"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteResourceItem('infographic', '${info.id}')" class="text-xs text-red-500"><i class="fa-solid fa-trash"></i></button>

                        ` : ''}
                      </div>
                      ${isPdf ? `

    function emptyResourceState(title, icon) {
      return `

          ${node.children && node.children.length > 0 ? `
            <div class="w-0.5 h-6 bg-slate-300 dark:bg-slate-600"></div>

    // QUIZ COMPONENT
    let userAnswers = {};
    let quizSubmitted = false;
    function renderQuizEngine(quiz) {
      const ui = appState.data.config.uiTexts;
      if (quizSubmitted) {
        let score = 0;
        quiz.forEach((q, i) => { if (userAnswers[i] === q.answer) score++; });
        return `
          <div class="max-w-md mx-auto text-center py-8 space-y-6">
            <div class="w-20 h-20 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl font-extrabold">
              ${score}/${quiz.length}
            </div>
            <div>
              <h3 class="text-2xl font-bold text-slate-900 dark:text-white">${ui.quizCompletedTitle}</h3>
              <p class="text-xs text-slate-400 mt-1">Score: ${Math.round((score/quiz.length)*100)}%</p>
            </div>
            <button onclick="quizSubmitted=false; userAnswers={}; renderChapterDetailView(document.getElementById('app-content'));" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white font-semibold text-xs shadow-md btn-3d">${ui.retryQuizBtn}</button>
          </div>
        `;
      }

      return `
        <div class="max-w-xl mx-auto space-y-6">
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Interactive Assessment</h3>
          <div class="space-y-6">
            ${quiz.map((q, idx) => `
              <div class="p-4 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-200 dark:border-slate-700 space-y-3 relative card-3d">
                ${appState.isAdmin ? `
                  <div class="absolute top-3 right-3 flex gap-2">
                    <button onclick="openModal('editQuizItem', '${q.id}')" class="text-xs text-slate-500 hover:text-brand-500"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteResourceItem('quiz', '${q.id}')" class="text-xs text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                  </div>
                ` : ''}
                <p class="font-semibold text-xs sm:text-sm text-slate-900 dark:text-white pr-12">${idx + 1}. ${q.question}</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  ${q.options.map((opt, oIdx) => `
                    <button onclick="userAnswers[${idx}] = ${oIdx}; renderChapterDetailView(document.getElementById('app-content'));" class="p-2.5 rounded-lg border text-left text-xs font-medium transition btn-3d ${userAnswers[idx] === oIdx ? 'bg-brand-600 text-white border-brand-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-brand-500'}">
                      ${opt}
                    </button>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
          <button onclick="quizSubmitted=true; renderChapterDetailView(document.getElementById('app-content'));" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md btn-3d" ${Object.keys(userAnswers).length < quiz.length ? 'disabled opacity-50' : ''}>
            ${ui.submitQuizBtn}
          </button>
        </div>
      `;
    }

    // DATA TABLE COMPONENT
    let tableSearchQuery = "";
    function renderDataTableModule(dt) {
      const ui = appState.data.config.uiTexts;
      if (!dt || !dt.columns) return emptyResourceState('Data Table (.CSV / Admin Grid)', 'fa-table');
      const filtered = dt.rows.filter(row => row.some(cell => String(cell).toLowerCase().includes(tableSearchQuery.toLowerCase())));
      return `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white">Reference Data Table</h3>
            <div class="flex items-center gap-2 w-full sm:w-auto">
              <input type="text" placeholder="${ui.searchPlaceholder}" value="${tableSearchQuery}" oninput="tableSearchQuery = this.value; renderChapterDetailView(document.getElementById('app-content'));" class="px-3.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs outline-none focus:ring-2 focus:ring-brand-500 w-full sm:w-64" />
              ${appState.isAdmin ? `<button onclick="deleteResourceItem('datatable', '${dt.id}')" class="px-3 py-1.5 rounded-xl bg-red-500 text-white text-xs font-bold hover:bg-red-600 btn-3d"><i class="fa-solid fa-trash"></i></button>` : ''}
            </div>
          </div>
          <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                <tr>
                  ${dt.columns.map(c => `<th class="p-3 border-b border-slate-200 dark:border-slate-700">${c}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                ${filtered.map(row => `
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/40">
                    ${row.map(cell => `<td class="p-3 text-slate-800 dark:text-slate-200">${cell}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // CONTEXT-AWARE AI CHATBOT
    let chatMessages = [
      { sender: 'ai', text: 'Hello! I am your AI Assistant. I have indexed all uploaded reports, notes, flashcards, quiz questions, and data tables for this chapter. How can I help you today?' }
    ];

    function renderContextAwareAIChatbot(resources) {
      const ui = appState.data.config.uiTexts;
      return `
        <div class="max-w-2xl mx-auto flex flex-col h-[420px]">
          <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700 mb-3">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-robot text-brand-500 text-xl"></i>
              <div>
                <h3 class="font-bold text-slate-900 dark:text-white text-xs sm:text-sm">${ui.aiChatTitle}</h3>
                <p class="text-[10px] text-slate-400">${ui.aiChatSubtitle}</p>
              </div>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 font-mono">Active Index</span>
          </div>

          <div id="chat-box" class="flex-grow overflow-y-auto space-y-3 pr-2">
            ${chatMessages.map(m => `
              <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[85%] rounded-2xl p-3 text-xs ${m.sender === 'user' ? 'bg-brand-600 text-white rounded-br-none' : 'bg-slate-100 dark:bg-slate-700/80 text-slate-800 dark:text-slate-200 rounded-bl-none'}">
                  ${m.text}
                </div>
              </div>
            `).join('')}
          </div>

          <form onsubmit="handleAIChat(event, ${JSON.stringify(resources).replace(/"/g, '&quot;')})" class="flex gap-2 pt-3 border-t border-slate-200 dark:border-slate-700 mt-2">
            <input type="text" id="ai-chat-input" placeholder="${ui.aiChatPlaceholder}" required class="flex-grow px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500" />
            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold btn-3d"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>
      `;
    }

    function handleAIChat(e, resources) {
      e.preventDefault();
      const input = document.getElementById('ai-chat-input');
      const query = input.value.trim();
      if (!query) return;

      chatMessages.push({ sender: 'user', text: query });
      input.value = '';
      renderChapterDetailView(document.getElementById('app-content'));

      let responseText = extractContextResponse(query, resources);

      setTimeout(() => {
        chatMessages.push({ sender: 'ai', text: responseText });
        renderChapterDetailView(document.getElementById('app-content'));
      }, 400);
    }

    function extractContextResponse(query, resources) {
      const qLower = query.toLowerCase();

      const notesList = getResourceList(resources, 'notes');
      for (let note of notesList) {
        if (note.content && (qLower.includes('formula') || qLower.includes('law') || qLower.includes('mirror') || qLower.includes('snell'))) {
          return `Extracted from Chapter Reports & Notes:\n\n` + note.content;
        }
      }

      const flashcardsList = getResourceList(resources, 'flashcards');
      if (flashcardsList.length > 0) {
        const matchCard = flashcardsList.find(c => c.q && (c.q.toLowerCase().includes(qLower) || c.a.toLowerCase().includes(qLower)));
        if (matchCard) {
          return `Extracted from Flashcards Index:\nQ: ${matchCard.q}\nA: ${matchCard.a}`;
        }
      }

      const quizList = getResourceList(resources, 'quiz');
      if (quizList.length > 0) {
        const matchQuiz = quizList.find(q => q.question && q.question.toLowerCase().includes(qLower));
        if (matchQuiz) {
          return `Extracted from Quiz Questions:\nQ: ${matchQuiz.question}\nCorrect Answer: ${matchQuiz.options[matchQuiz.answer]}`;
        }
      }

      const dtList = getResourceList(resources, 'datatable');
      if (dtList.length > 0 && dtList[0].rows) {
        const matchRow = dtList[0].rows.find(row => row.some(cell => String(cell).toLowerCase().includes(qLower)));
        if (matchRow) {
          return `Extracted from Chapter Data Table:\n${dtList[0].columns.join(' | ')}\n${matchRow.join(' | ')}`;
        }
      }

      return `AI Response regarding "${query}":\nBased on uploaded chapter resources, concepts adhere to standard educational guidelines. Consult the Reports, Flashcards, or Data Table section for detailed data tables and formulas.`;
    }

    // --- MODAL AND UPLOADER HANDLERS ---
    let modalAction = null;
    let modalTargetId = null;

    function openModal(action, targetId = null) {
      modalAction = action;
      modalTargetId = targetId;
      const modal = document.getElementById('action-modal');
      const title = document.getElementById('modal-title');
      const fields = document.getElementById('modal-fields');

      fields.innerHTML = '';
      loadedFileBlob = null;
      loadedFileType = null;
      modal.classList.remove('hidden');

      const curClass = appState.data.classes.find(c => c.id === appState.selectedClassId);
      const curMedium = curClass?.mediums?.find(m => m.id === appState.selectedMediumId);

    let loadedFileBlob = null;
    let loadedFileType = null;

    function parseLogoFile(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('f-logo-url').value = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function parseClassImageFile(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('f-img-url').value = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function parseLocalFile(e, allowed) {
      const file = e.target.files[0];
      if (file) {
        if (loadedFileBlob && loadedFileBlob.startsWith('blob:')) {
          URL.revokeObjectURL(loadedFileBlob);
        }
        loadedFileType = file.type || 'application/octet-stream';
        loadedFileBlob = URL.createObjectURL(file);

        const urlInput = document.getElementById('f-res-url');
        if (urlInput) urlInput.value = loadedFileBlob;

        const titleInput = document.getElementById('f-res-title');
        if (titleInput && !titleInput.value) {
          titleInput.value = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        }
      }
    }

    function parseLocalCsvFile(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const rawInput = document.getElementById('f-raw-csv');
          if (rawInput) rawInput.value = evt.target.result;
        };
        reader.readAsText(file);
      }
    }

          <div><label class="font-bold block mb-1">Central Root Node Title</label><input type="text" id="mm-root" value="Optics" class="w-full px-3 py-1.5 rounded-lg border dark:border-slate-700 bg-slate-900 text-xs" /></div>
          <div><label class="font-bold block mb-1">Branch 1 Title</label><input type="text" id="mm-b1-title" value="Reflection" class="w-full px-3 py-1.5 rounded-lg border dark:border-slate-700 bg-slate-900 text-xs" /></div>
          <div><label class="font-bold block mb-1">Branch 1 Subnodes (Comma separated)</label><input type="text" id="mm-b1-sub" value="Concave Mirrors, Convex Mirrors" class="w-full px-3 py-1.5 rounded-lg border dark:border-slate-700 bg-slate-900 text-xs" /></div>
          <div><label class="font-bold block mb-1">Branch 2 Title</label><input type="text" id="mm-b2-title" value="Refraction" class="w-full px-3 py-1.5 rounded-lg border dark:border-slate-700 bg-slate-900 text-xs" /></div>
          <div><label class="font-bold block mb-1">Branch 2 Subnodes (Comma separated)</label><input type="text" id="mm-b2-sub" value="Snell Law, Lenses, Power" class="w-full px-3 py-1.5 rounded-lg border dark:border-slate-700 bg-slate-900 text-xs" /></div>
        </div>
      `;
    }

    function closeModal() { document.getElementById('action-modal').classList.add('hidden'); }

    function handleModalSubmit(e) {
      e.preventDefault();
      const curClass = appState.data.classes.find(c => c.id === appState.selectedClassId);
      const curMedium = curClass?.mediums?.find(m => m.id === appState.selectedMediumId);
      const curSubject = curMedium?.subjects?.find(s => s.id === appState.selectedSubjectId);
      const curChapter = curSubject?.chapters?.find(ch => ch.id === appState.selectedChapterId);

      try {
        switch (modalAction) {
          case 'editGlobalConfig':
            appState.data.config.brandName = document.getElementById('f-brand-name').value;
            appState.data.config.logoUrl = document.getElementById('f-logo-url').value;
            
            // Save all custom UI static texts
            if (!appState.data.config.uiTexts) appState.data.config.uiTexts = {};
            appState.data.config.uiTexts.classesTitle = document.getElementById('f-ui-classesTitle').value;
            appState.data.config.uiTexts.classesSubtitle = document.getElementById('f-ui-classesSubtitle').value;
            appState.data.config.uiTexts.selectMediumBtn = document.getElementById('f-ui-selectMediumBtn').value;
            appState.data.config.uiTexts.backToClassesBtn = document.getElementById('f-ui-backToClassesBtn').value;
            appState.data.config.uiTexts.selectSubjectBtn = document.getElementById('f-ui-selectSubjectBtn').value;
            appState.data.config.uiTexts.backToMediumsBtn = document.getElementById('f-ui-backToMediumsBtn').value;
            appState.data.config.uiTexts.viewChaptersBtn = document.getElementById('f-ui-viewChaptersBtn').value;
            appState.data.config.uiTexts.backToSubjectsBtn = document.getElementById('f-ui-backToSubjectsBtn').value;
            appState.data.config.uiTexts.openChapterHubBtn = document.getElementById('f-ui-openChapterHubBtn').value;
            appState.data.config.uiTexts.quizCompletedTitle = document.getElementById('f-ui-quizCompletedTitle').value;
            appState.data.config.uiTexts.retryQuizBtn = document.getElementById('f-ui-retryQuizBtn').value;
            appState.data.config.uiTexts.submitQuizBtn = document.getElementById('f-ui-submitQuizBtn').value;
            appState.data.config.uiTexts.searchPlaceholder = document.getElementById('f-ui-searchPlaceholder').value;
            appState.data.config.uiTexts.aiChatTitle = document.getElementById('f-ui-aiChatTitle').value;
            appState.data.config.uiTexts.aiChatSubtitle = document.getElementById('f-ui-aiChatSubtitle').value;
            appState.data.config.uiTexts.aiChatPlaceholder = document.getElementById('f-ui-aiChatPlaceholder').value;

            updateGlobalBranding();
            break;
          case 'addClass':
            appState.data.classes.push({ 
              id: 'cls-' + Date.now(), 
              name: document.getElementById('f-name').value, 
              description: document.getElementById('f-desc').value, 
              imageUrl: document.getElementById('f-img-url').value,
              mediums: [] 
            });
            break;
          case 'editClass':
            curClass.name = document.getElementById('f-name').value;
            curClass.description = document.getElementById('f-desc').value;
            curClass.imageUrl = document.getElementById('f-img-url').value;
            break;
          case 'addMedium':
            curClass.mediums.push({ 
              id: 'med-' + Date.now(), 
              name: document.getElementById('f-name').value, 
              code: document.getElementById('f-code').value, 
              imageUrl: document.getElementById('f-img-url').value,
              icon: 'fa-language', 
              subjects: [] 
            });
            break;
          case 'editMedium': {
            const med = curClass.mediums.find(m => m.id === modalTargetId);
            if (med) { 
              med.name = document.getElementById('f-name').value; 
              med.code = document.getElementById('f-code').value; 
              med.imageUrl = document.getElementById('f-img-url').value;
            }
            break;
          }
          case 'addSubject':
            curMedium.subjects.push({ 
              id: 'sbj-' + Date.now(), 
              name: document.getElementById('f-name').value, 
              code: document.getElementById('f-code').value, 
              description: document.getElementById('f-desc').value, 
              imageUrl: document.getElementById('f-img-url').value,
              icon: 'fa-book', 
              chapters: [] 
            });
            break;
          case 'editSubject': {
            const sbj = curMedium.subjects.find(s => s.id === modalTargetId);
            if (sbj) { 
              sbj.name = document.getElementById('f-name').value; 
              sbj.code = document.getElementById('f-code').value; 
              sbj.description = document.getElementById('f-desc').value; 
              sbj.imageUrl = document.getElementById('f-img-url').value;
            }
            break;
          }
          case 'addChapter':
            curSubject.chapters.push({ id: 'ch-' + Date.now(), name: document.getElementById('f-name').value, description: document.getElementById('f-desc').value, resources: {} });
            break;
          case 'editChapter': {
            const ch = curSubject.chapters.find(c => c.id === modalTargetId);
            if (ch) { ch.name = document.getElementById('f-name').value; ch.description = document.getElementById('f-desc').value; }
            break;
          }
          case 'editResourceItem': {
            const { tab, id } = modalTargetId;
            const list = getResourceList(curChapter.resources, tab);
            const item = list.find(i => i.id === id);
            if (item) {
              item.title = document.getElementById('f-res-title').value;
              item.url = document.getElementById('f-res-url').value;
              item.content = document.getElementById('f-res-content').value;
            }
            break;
          }
          case 'editFlashcard': {
            const list = getResourceList(curChapter.resources, 'flashcards');
            const card = list.find(c => c.id === modalTargetId);
            if (card) {
              card.q = document.getElementById('f-fc-q').value;
              card.a = document.getElementById('f-fc-a').value;
            }
            break;
          }
          case 'editQuizItem': {
            const list = getResourceList(curChapter.resources, 'quiz');
            const quiz = list.find(q => q.id === modalTargetId);
            if (quiz) {
              quiz.question = document.getElementById('f-qz-q').value;
              quiz.options = [
                document.getElementById('f-qz-o0').value,
                document.getElementById('f-qz-o1').value,
                document.getElementById('f-qz-o2').value,
                document.getElementById('f-qz-o3').value
              ];
              quiz.answer = parseInt(document.getElementById('f-qz-ans').value || 0);
            }
            break;
          }
          case 'uploadResource': {
            const tab = modalTargetId;
            if (!curChapter.resources) curChapter.resources = {};

            if (['flashcards', 'quiz', 'datatable'].includes(tab)) {
              const rawCsv = document.getElementById('f-raw-csv').value;
              if (tab === 'flashcards') {
                if (!Array.isArray(curChapter.resources.flashcards)) curChapter.resources.flashcards = [];
                const lines = rawCsv.split('\n').filter(l => l.trim());
                lines.forEach(l => {
                  const parts = l.split(',');
                  curChapter.resources.flashcards.push({ id: 'fc-' + Date.now() + Math.random(), q: parts[0]?.trim() || '', a: parts[1]?.trim() || '' });
                });
              } else if (tab === 'quiz') {
                if (!Array.isArray(curChapter.resources.quiz)) curChapter.resources.quiz = [];
                const lines = rawCsv.split('\n').filter(l => l.trim());
                lines.forEach(l => {
                  const p = l.split(',');
                  curChapter.resources.quiz.push({ id: 'qz-' + Date.now() + Math.random(), question: p[0]?.trim() || '', options: [p[1]?.trim(), p[2]?.trim(), p[3]?.trim(), p[4]?.trim()], answer: parseInt(p[5] || 0) });
                });
              } else if (tab === 'datatable') {
                const lines = rawCsv.split('\n').filter(l => l.trim());
                if (lines.length > 0) {
                  const cols = lines[0].split(',').map(c => c.trim());
                  const rows = lines.slice(1).map(r => r.split(',').map(c => c.trim()));
                  curChapter.resources.datatable = [{ id: 'dt-' + Date.now(), columns: cols, rows: rows }];
                }
              }
            } else {
              if (!Array.isArray(curChapter.resources[tab])) {
                const existing = curChapter.resources[tab];
                curChapter.resources[tab] = existing && existing.url ? [existing] : [];
              }

              const title = document.getElementById('f-res-title').value;
              const url = document.getElementById('f-res-url').value;
              const content = document.getElementById('f-res-content').value;

              let mimeType = loadedFileType;
              if (!mimeType) {
                const lowerUrl = url.toLowerCase();
                if (lowerUrl.endsWith('.mp4')) mimeType = 'video/mp4';
                else if (lowerUrl.endsWith('.mov')) mimeType = 'video/quicktime';
                else if (lowerUrl.endsWith('.mp3')) mimeType = 'audio/mpeg';
                else if (lowerUrl.endsWith('.wav')) mimeType = 'audio/wav';
                else if (lowerUrl.endsWith('.pdf')) mimeType = 'application/pdf';
                else mimeType = 'application/octet-stream';
              }

              curChapter.resources[tab].push({
                id: 'res-' + Date.now(),
                title: title || `Item ${curChapter.resources[tab].length + 1}`,
                url: url,
                content: content || '',
                type: mimeType
              });
            }
            break;
          }
          case 'editMindmap': {
            const root = document.getElementById('mm-root').value;
            const b1Title = document.getElementById('mm-b1-title').value;
            const b1Sub = document.getElementById('mm-b1-sub').value.split(',').map(s=>({name: s.trim()}));
            const b2Title = document.getElementById('mm-b2-title').value;
            const b2Sub = document.getElementById('mm-b2-sub').value.split(',').map(s=>({name: s.trim()}));
            curChapter.resources.mindmap = {
              name: root,
              children: [
                { name: b1Title, color: "#0284c7", children: b1Sub },
                { name: b2Title, color: "#10b981", children: b2Sub }
              ]
            };
            break;
          }
        }

        saveData();
      } catch (err) {
        console.error("Error saving state:", err);
      } finally {
        closeModal();
        renderView();
      }
    }

    function deleteResourceItem(tab, itemId) {
      const curClass = appState.data.classes.find(c => c.id === appState.selectedClassId);
      const curMedium = curClass?.mediums?.find(m => m.id === appState.selectedMediumId);
      const curSubject = curMedium?.subjects?.find(s => s.id === appState.selectedSubjectId);
      const curChapter = curSubject?.chapters?.find(ch => ch.id === appState.selectedChapterId);

      if (curChapter?.resources) {
        if (tab === 'mindmap') {
          delete curChapter.resources.mindmap;
        } else if (Array.isArray(curChapter.resources[tab])) {
          curChapter.resources[tab] = curChapter.resources[tab].filter(item => item.id !== itemId);
        }
        saveData();
        renderView();
      }
    }

    function deleteClass(id) { if (confirm("Delete this Class and all its subjects?")) { appState.data.classes = appState.data.classes.filter(c => c.id !== id); saveData(); renderView(); } }
    function deleteMedium(id) { const c = appState.data.classes.find(cls => cls.id === appState.selectedClassId); if (c) { c.mediums = c.mediums.filter(m => m.id !== id); saveData(); renderView(); } }
    function deleteSubject(id) { const c = appState.data.classes.find(cls => cls.id === appState.selectedClassId); const m = c?.mediums?.find(med => med.id === appState.selectedMediumId); if (m) { m.subjects = m.subjects.filter(s => s.id !== id); saveData(); renderView(); } }
    function deleteChapter(id) { const c = appState.data.classes.find(cls => cls.id === appState.selectedClassId); const m = c?.mediums?.find(med => med.id === appState.selectedMediumId); const s = m?.subjects?.find(sbj => sbj.id === appState.selectedSubjectId); if (s) { s.chapters = s.chapters.filter(ch => ch.id !== id); saveData(); renderView(); } }

    function openLightboxFile(url, type) {
      const box = document.getElementById('file-lightbox');
      const container = document.getElementById('lightbox-container');
      if (type === 'pdf') {
        container.innerHTML = `<iframe src="${url}" class="w-full h-full"></iframe>`;
      } else {
        container.innerHTML = `<img src="${url}" class="max-w-full max-h-full object-contain" />`;
      }
      box.classList.add('flex');
      box.classList.remove('hidden');
    }
    function closeLightbox() { 
      const box = document.getElementById('file-lightbox');
      box.classList.add('hidden');
      box.classList.remove('flex');
    }

    window.onload = function() {
      loadState();
      updateAdminUI();
      renderBreadcrumb();
      renderView();
    };
  </script>
</body>
</html>
